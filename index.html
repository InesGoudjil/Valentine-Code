<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>For Meriem 💖</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ffe6e6, #fff5cc);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 25px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      width: 350px;
      position: relative;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 20px;
    }

    .buttons {
      margin-top: 30px;
      position: relative;
      height: 150px;
    }

    button {
      padding: 15px 35px;
      font-size: 20px;
      border: none;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.3s;
    }

    #yesBtn {
      background: #ff6b81;
      color: white;
      margin-right: 20px;
    }

    #yesBtn:hover {
      transform: scale(1.2);
    }

    #noBtn {
      background: #ccc;
      position: absolute;
      left: 200px;
      top: 0;
    }

    .result {
      display: none;
    }

    .result img {
      width: 220px;
      margin-top: 20px;
      border-radius: 15px;
    }

    .cute-icon {
      font-size: 50px;
      margin-bottom: 15px;
    }

    .heart {
      position: absolute;
      font-size: 20px;
      animation: float 3s linear infinite;
    }

    @keyframes float {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-150px); opacity: 0; }
    }
  </style>
</head>

<body>

  <div class="container" id="card">
    <div class="cute-icon">🐝💖</div>
    <h1>Will u my Valentine, <br> Meriem?</h1>

    <div class="buttons">
      <button id="yesBtn">Yes 💘</button>
      <button id="noBtn">No 🙄</button>
    </div>

    <div class="result" id="result">
      <div class="cute-icon">💌✨</div>
      <h2>YAAAY!! 🥹💞</h2>
      <p>I knew it 😌<br>You just made my heart very happy 💕</p>
      <img src="https://media.giphy.com/media/l0MYyDa8S9ghzNebm/giphy.gif" alt="cute gif placeholder">
    </div>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const result = document.getElementById('result');

    // NO button completely avoids the cursor
    document.addEventListener('mousemove', (e) => {
      const rect = noBtn.getBoundingClientRect();
      const mouseX = e.clientX;
      const mouseY = e.clientY;

      const offset = 100; // distance from mouse
      if (mouseX > rect.left - offset && mouseX < rect.right + offset &&
          mouseY > rect.top - offset && mouseY < rect.bottom + offset) {
        const x = Math.random() * (window.innerWidth - rect.width);
        const y = Math.random() * (window.innerHeight - rect.height);
        noBtn.style.left = `${x}px`;
        noBtn.style.top = `${y}px`;
      }
    });

    yesBtn.addEventListener('click', () => {
      document.querySelector('.buttons').style.display = 'none';
      result.style.display = 'block';
      createHearts();
    });

    function createHearts() {
      for (let i = 0; i < 20; i++) {
        const heart = document.createElement('div');
        heart.classList.add('heart');
        heart.innerText = '💖';
        heart.style.left = Math.random() * window.innerWidth + 'px';
        heart.style.bottom = '0px';
        document.body.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 3000);
      }
    }
  </script>

</body>
</html>
